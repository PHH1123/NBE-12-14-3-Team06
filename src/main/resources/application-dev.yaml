# application-dev.yaml
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    anthropic:
      api-key: ${CLAUDE_API_KEY}
      timeout: 30s
      chat:
        model: claude-sonnet-5
        max-tokens: 1024



custom:
  jwt:
    secret-key: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRATION}
    refresh-expire-seconds: ${REFRESH_TOKEN_EXPIRATION}
  cookie:
    secure: false
    same-site: Lax
