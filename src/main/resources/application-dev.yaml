# application-dev.yaml
spring:
  datasource:
#    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}?allowPublicKeyRetrieval=true&useSSL=false   # MySQL 용 옵션이 남아 있어 주석 처리
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: create
  ai:
    anthropic:
      api-key: ${CLAUDE_API_KEY}
      timeout: 30s
      chat:
        model: claude-sonnet-5
        max-tokens: 1024



custom:
  jwt:
    secret-key: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRATION}
    refresh-expire-seconds: ${REFRESH_TOKEN_EXPIRATION}
  cookie:
    secure: false
    same-site: Lax
##  claude:
##    api-key: ${CLAUDE_API_KEY}
##    model: claude-sonnet-5
##    max-tokens: 1024
  toss:
    secret-key: ${TOSS_SECRET}
  ai:
    report-summary:
      prompt-version: v2
  crypto:
    encryption-key: ${PII_ENCRYPTION_KEY}